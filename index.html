<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta name="keywords" content="Altos FM, radio en vivo, Altos Mirandinos, Los Teques, San Antonio de los Altos, radio Venezuela" />

  <meta property="og:title" content="Altos FM | En Vivo" />
  <meta property="og:description" content="La señal de los Altos Mirandinos, en vivo para todo el mundo." />
  <meta property="og:url" content="https://altosfm.com/" />
  <meta property="og:image" content="./icon-512.png" />

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#001f54" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" href="./icon-192.png" type="image/png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Altos FM" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <link rel="stylesheet" href="./style.css?v=3" />
</head>
<body>
  <a class="skip-link" href="#contenido-principal">Saltar al contenido principal</a>

  <div class="page-shell">
    <header class="site-header" aria-label="Encabezado del sitio">
      <div class="brand">
        <img src="./logo.png" alt="Altos FM 107.1 — Por todo lo alto" class="site-logo" />
      </div>

      <nav class="social-nav" aria-label="Redes sociales">
        <a href="https://www.instagram.com/altosfm/" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
          <i class="fab fa-instagram" aria-hidden="true"></i>
        </a>
        <a href="https://www.facebook.com/profile.php?id=100051976571784&locale=es_LA" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook">
          <i class="fab fa-facebook-f" aria-hidden="true"></i>
        </a>
        <a href="https://wa.me/584141001071" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" title="WhatsApp">
          <i class="fab fa-whatsapp" aria-hidden="true"></i>
        </a>
        <a href="https://www.tiktok.com/@altosfm" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="TikTok" title="TikTok">
          <i class="fab fa-tiktok" aria-hidden="true"></i>
        </a>
      </nav>
    </header>

    <main id="contenido-principal" class="main-content">
      <section class="hero-block" aria-labelledby="titulo-principal">
        <p class="eyebrow">107.1 FM &middot; Altos Mirandinos</p>
        <h1 id="titulo-principal" class="main-title">Por todo lo alto</h1>
      </section>

      <section class="player-card is-idle" aria-labelledby="player-title">
        <div class="live-pill" id="live-pill">
          <span class="live-dot" id="live-dot" aria-hidden="true"></span>
          <span id="live-label">En vivo</span>
        </div>

        <h2 id="player-title" class="sr-only">Reproductor de radio</h2>

        <div class="cover-wrap">
          <img
            id="album-cover"
            class="album-cover"
            src="./logo.png"
            alt="Portada del álbum o imagen referencial de la emisora"
          />
        </div>

        <p class="track-label">ESTÁS ESCUCHANDO</p>
        <p id="track-name" class="track-name" aria-live="polite" aria-atomic="true">Altos FM</p>

        <p id="player-status" class="player-status" aria-live="polite" aria-atomic="true">
          Estado: listo para reproducir
        </p>

        <div class="divider" aria-hidden="true"></div>

        <div class="visualizer-wrap">
          <div id="wave-container" class="wave-container" aria-hidden="true"></div>

          <div class="equalizer" aria-hidden="true">
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
          </div>
        </div>

        <div class="controls">
          <button id="masterPlay" class="play-btn" type="button" aria-label="Reproducir radio en vivo" aria-pressed="false">
            <i id="mainIcon" class="fas fa-play" aria-hidden="true"></i>
          </button>
        </div>

        <div class="volume-control">
          <i class="fas fa-volume-down" aria-hidden="true"></i>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" aria-label="Control de volumen" />
          <i class="fas fa-volume-up" aria-hidden="true"></i>
        </div>
      </section>

      <div class="install-wrap">
        <button id="installBtn" class="install-btn" hidden type="button">
          <i class="fas fa-download" aria-hidden="true"></i>
          <span>Instalar app</span>
        </button>
      </div>
    </main>

    <footer class="site-footer">
      <p>Altos FM &middot; Los Altos Mirandinos, Venezuela</p>
    </footer>
  </div>

  <a
    href="https://wa.me/584141001071?text=Hola%20Altos%20FM%2C%20quiero%20solicitar%20una%20canci%C3%B3n%20%F0%9F%8E%B6"
    class="whatsapp-float"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Solicita tu canción vía WhatsApp"
  >
    <i class="fab fa-whatsapp" aria-hidden="true"></i>
    <span class="whatsapp-float-label">Solicita tu canción vía WhatsApp</span>
  </a>

  <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>
  <script src="./app.js?v=3"></script>
</body>
</html>
